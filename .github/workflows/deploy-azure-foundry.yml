# Build and deploy WocconWaker to Azure Container Apps (Foundry mode) on push to azure-foundry.
# Requires: GitHub secrets AZURE_CREDENTIALS (JSON: clientId, clientSecret, subscriptionId, tenantId),
#   FOUNDRY_ENDPOINT, FOUNDRY_API_KEY, FOUNDRY_DEPLOYMENT (and optionally ACR_NAME if not using default from RG).
# One-time: Create RG, ACR, and Container App (e.g. run deploy-container-app.sh once) or use existing.

name: Deploy to Azure (Foundry)

on:
  push:
    branches: [azure-foundry]

env:
  RESOURCE_GROUP: rg-wocconwaker
  CONTAINER_APP_NAME: wocconwaker-app
  CONTAINER_APP_ENV: wocconwaker-env
  IMAGE_NAME: wocconwaker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR name
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          if [ -z "$ACR_NAME" ]; then
            echo "::error::No ACR found in ${{ env.RESOURCE_GROUP }}. Create one (e.g. run deploy-container-app.sh once)."
            exit 1
          fi
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          ACR_SERVER=$(az acr show --name "$ACR_NAME" --resource-group "${{ env.RESOURCE_GROUP }}" --query loginServer -o tsv)
          echo "server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: |
          az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build and push image
        run: |
          IMAGE="${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -f Dockerfile.azure -t "$IMAGE" -t "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest" .
          docker push "$IMAGE"
          docker push "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}" \
            --set-env-vars \
              "WOCCON_MODE=server" \
              "PORT=8000" \
              "LOCAL_LLM=false" \
              "FOUNDRY_ENDPOINT=${{ secrets.FOUNDRY_ENDPOINT }}" \
              "FOUNDRY_API_KEY=${{ secrets.FOUNDRY_API_KEY }}" \
              "FOUNDRY_DEPLOYMENT=${{ secrets.FOUNDRY_DEPLOYMENT }}" \
            --output none

      - name: Get app URL
        id: url
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          if [ -n "$FQDN" ]; then
            echo "Webhook URL: https://${FQDN}/webhook"
          fi

      - name: Summary
        run: |
          echo "## Deployment summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.url.outputs.fqdn }}" ]; then
            echo "- App URL: https://${{ steps.url.outputs.fqdn }}" >> $GITHUB_STEP_SUMMARY
            echo "- Messenger webhook: https://${{ steps.url.outputs.fqdn }}/webhook" >> $GITHUB_STEP_SUMMARY
          fi
