# Build and deploy WocconWaker to Azure Container Apps (Foundry mode) on push to azure-foundry.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   AZURE_CREDENTIALS (JSON: clientId, clientSecret, subscriptionId, tenantId from create-for-rbac --sdk-auth)
#   FOUNDRY_ENDPOINT, FOUNDRY_API_KEY, FOUNDRY_DEPLOYMENT
#
# Variables (Settings → Secrets and variables → Actions → Variables):
#   AZURE_RESOURCE_GROUP – resource group containing Container App and ACR
#   AZURE_CONTAINER_APP_NAME – Container App name
# Optional variable:
#   ACR_IMAGE_NAME – Docker image repository name (default: wocconwaker)

name: Deploy to Azure (Foundry)

on:
  push:
    branches: [azure-foundry]

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  IMAGE_NAME: ${{ vars.ACR_IMAGE_NAME || 'wocconwaker' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure repository variables
        run: |
          if [ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then
            echo "::error::Set repository variable AZURE_RESOURCE_GROUP (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          if [ -z "${{ vars.AZURE_CONTAINER_APP_NAME }}" ]; then
            echo "::error::Set repository variable AZURE_CONTAINER_APP_NAME"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR name
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          if [ -z "$ACR_NAME" ]; then
            echo "::error::No ACR found in ${{ env.RESOURCE_GROUP }}. Create one in that resource group first."
            exit 1
          fi
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          ACR_SERVER=$(az acr show --name "$ACR_NAME" --resource-group "${{ env.RESOURCE_GROUP }}" --query loginServer -o tsv)
          echo "server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: |
          az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build and push image
        run: |
          IMAGE="${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -f Dockerfile.azure -t "$IMAGE" -t "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest" .
          docker push "$IMAGE"
          docker push "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Container App
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          az containerapp secret set \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --secrets \
              "foundry-api-key=${{ secrets.FOUNDRY_API_KEY }}" \
              "jwt-secret=${{ secrets.JWT_SECRET }}" \
              "smtp-password=${{ secrets.SMTP_PASSWORD }}" \
              "anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }}" \
              "panel-admin-password=${{ secrets.PANEL_ADMIN_PASSWORD }}" \
              "page-access-token=${{ secrets.PAGE_ACCESS_TOKEN }}" \
            --output none
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}" \
            --set-env-vars \
              "WOCCON_MODE=server" \
              "PORT=8000" \
              "LOCAL_LLM=false" \
              "FOUNDRY_ENDPOINT=${{ secrets.FOUNDRY_ENDPOINT }}" \
              "FOUNDRY_API_KEY=secretref:foundry-api-key" \
              "FOUNDRY_DEPLOYMENT=${{ secrets.FOUNDRY_DEPLOYMENT }}" \
              "FOUNDRY_API_VERSION=${{ vars.FOUNDRY_API_VERSION || '2024-05-01-preview' }}" \
              "ANTHROPIC_API_KEY=secretref:anthropic-api-key" \
              "ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL }}" \
              "JWT_SECRET=secretref:jwt-secret" \
              "JWT_EXPIRE_MINUTES=1440" \
              "PANEL_ADMIN_EMAIL=${{ vars.PANEL_ADMIN_EMAIL }}" \
              "PANEL_ADMIN_PASSWORD=secretref:panel-admin-password" \
              "PANEL_PUBLIC_BASE_URL=https://${FQDN}" \
              "PANEL_CORS_ORIGINS=https://${FQDN}" \
              "EMAIL_MODE=${{ vars.EMAIL_MODE || 'smtp' }}" \
              "SMTP_HOST=${{ vars.SMTP_HOST }}" \
              "SMTP_PORT=${{ vars.SMTP_PORT || '587' }}" \
              "SMTP_USER=${{ vars.SMTP_USER }}" \
              "SMTP_PASSWORD=secretref:smtp-password" \
              "SMTP_FROM=${{ vars.SMTP_FROM }}" \
              "SMTP_USE_TLS=true" \
              "DATABASE_URL=${{ vars.DATABASE_URL || 'sqlite:///./data/woccon.db' }}" \
              "WOCCON_DICTIONARY_PATH=woccon_language/dictionary_unified.json" \
              "WOCCON_RULES_PATH=woccon_language/rules_unified.json" \
              "PAGE_ACCESS_TOKEN=secretref:page-access-token" \
              "VERIFY_TOKEN=${{ secrets.VERIFY_TOKEN }}" \
            --output none

      - name: Get app URL
        id: url
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          if [ -n "$FQDN" ]; then
            echo "Webhook URL: https://${FQDN}/webhook"
          fi

      - name: Summary
        run: |
          echo "## Deployment summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.url.outputs.fqdn }}" ]; then
            echo "- App URL: https://${{ steps.url.outputs.fqdn }}" >> $GITHUB_STEP_SUMMARY
            echo "- Messenger webhook: https://${{ steps.url.outputs.fqdn }}/webhook" >> $GITHUB_STEP_SUMMARY
          fi
