# Copy to cloudflared.yml (gitignored) and adjust tunnel ID, credentials path, hostname.
# See LOCAL_DEV.md.
#
# 1. cloudflared tunnel create woccon-dev
# 2. Add DNS: your hostname CNAME <TUNNEL_ID>.cfargotunnel.com
# 3. Set tunnel + credentials-file + hostname below (example: woccon-dev.example.com)

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /REPLACE/WITH/PATH/TO/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: woccon-dev.example.com
    service: http://localhost:8000
  - service: http_status:404
